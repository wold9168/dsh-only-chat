# Only Chat bundle layer.
#
# One row: the Host half that owns the chat directory, the read-only layer written
# into each chat Session and its Agent scope, the bounded history, and the
# browser-facing routes. Chats run the deployment's own default Agent preset, so
# this bundle declares no preset of its own — read-only is the only difference
# from an ordinary session.
- insert:
    - id: only-chat
      name: dsh-only-chat
      config: {}
